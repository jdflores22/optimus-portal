services:
  mysql:
    image: mysql:8.0
    container_name: optimus-v2-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: optimus_v2
      MYSQL_USER: optimus
      MYSQL_PASSWORD: optimus_secret
    ports:
      - "3307:3306"
    volumes:
      - optimus_v2_mysql_data:/var/lib/mysql
    command: ["--default-authentication-plugin=mysql_native_password", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot_secret"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    container_name: optimus-v2-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - optimus_v2_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  optimus_v2_mysql_data:
  optimus_v2_redis_data:
