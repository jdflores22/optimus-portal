framework:
    session:
        # Use file-based session storage in production (Hostinger shared hosting)
        # handler_id: 'session.handler.redis'  # Disabled - Redis not available
        # Production session configuration
        cookie_secure: true
        cookie_httponly: true
        cookie_samesite: 'lax'
        gc_probability: 1
        gc_divisor: 100
        gc_maxlifetime: 1800

