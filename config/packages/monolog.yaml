monolog:
    channels:
        - security
        - audit
        - error
        - avatar_colors

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/dev.log"
                level: debug
                channels: ["!event"]
            
            security:
                type: stream
                path: "%kernel.logs_dir%/security.log"
                level: info
                channels: ["security"]
            
            audit:
                type: stream
                path: "%kernel.logs_dir%/audit.log"
                level: info
                channels: ["audit"]
                formatter: 'monolog.formatter.json'
            
            avatar_colors:
                type: stream
                path: "%kernel.logs_dir%/avatar_colors.log"
                level: debug
                channels: ["avatar_colors"]
            
            error:
                type: stream
                path: "%kernel.logs_dir%/error.log"
                level: error
                channels: ["error"]

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                buffer_size: 50
            
            nested:
                type: rotating_file
                path: "%kernel.logs_dir%/prod.log"
                level: debug
                max_files: 30
                date_format: Y-m-d
            
            security:
                type: rotating_file
                path: "%kernel.logs_dir%/security.log"
                level: info
                channels: ["security"]
                max_files: 90
                date_format: Y-m-d
            
            audit:
                type: rotating_file
                path: "%kernel.logs_dir%/audit.log"
                level: info
                channels: ["audit"]
                formatter: 'monolog.formatter.json'
                max_files: 2555
                date_format: Y-m-d
            
            avatar_colors:
                type: rotating_file
                path: "%kernel.logs_dir%/avatar_colors.log"
                level: info
                channels: ["avatar_colors"]
                max_files: 30
                date_format: Y-m-d
            
            error:
                type: rotating_file
                path: "%kernel.logs_dir%/error.log"
                level: error
                channels: ["error"]
                max_files: 90
                date_format: Y-m-d
            
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]

when@test:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/test.log"
                level: debug
                channels: ["!event"]