framework:
    cache:
        prefix_seed: optimus_shipping_portal
        app: cache.adapter.filesystem

        pools:
            avatar_colors.cache:
                adapter: cache.adapter.filesystem
                default_lifetime: 3600
            form_configurations.cache:
                adapter: cache.adapter.filesystem
                default_lifetime: 3600
            user_permissions.cache:
                adapter: cache.adapter.filesystem
                default_lifetime: 1800
            dashboard_metrics.cache:
                adapter: cache.adapter.filesystem
                default_lifetime: 300
            file_metadata.cache:
                adapter: cache.adapter.filesystem
                default_lifetime: 7200
            manifest_workflow.cache:
                adapter: cache.adapter.filesystem
                default_lifetime: 3600
            manifest_authorization.cache:
                adapter: cache.adapter.filesystem
                default_lifetime: 1800
            edo_pdf.cache:
                adapter: cache.adapter.filesystem
                default_lifetime: 86400
            payment_history.cache:
                adapter: cache.adapter.filesystem
                default_lifetime: 300

when@prod:
    framework:
        cache:
            app: cache.adapter.redis
            default_redis_provider: '%env(REDIS_URL)%'
            pools:
                avatar_colors.cache:
                    adapter: cache.adapter.redis
                form_configurations.cache:
                    adapter: cache.adapter.redis
                user_permissions.cache:
                    adapter: cache.adapter.redis
                dashboard_metrics.cache:
                    adapter: cache.adapter.redis
                file_metadata.cache:
                    adapter: cache.adapter.redis
                manifest_workflow.cache:
                    adapter: cache.adapter.redis
                manifest_authorization.cache:
                    adapter: cache.adapter.redis
                edo_pdf.cache:
                    adapter: cache.adapter.redis
                payment_history.cache:
                    adapter: cache.adapter.redis
