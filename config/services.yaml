        public: true

    App\Service\EDONotificationService:
        public: true

    # EDO Expiration Listener - Automatic expiration detection on every request
    # IMPORTANT: High priority (256) to run BEFORE controllers load entities
    App\EventListener\EDOExpirationListener:
        arguments:
            $cacheDir: '%kernel.cache_dir%'
        tags:
            - { name: kernel.event_listener, event: kernel.request, priority: 256 }

imports:
    - { resource: services_api.yaml }
