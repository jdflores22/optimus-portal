        arguments:
            $cache: '@cache.app'

    # File Upload Service for payment receipts
    App\Service\FileUploadServiceInterface:
        alias: App\Service\FileUploadService
    
    App\Service\FileUploadService:
        public: true
        arguments:
            $storageBasePath: '%kernel.project_dir%/storage'
            $logger: '@logger'

    # Official Receipt Generator Service
    App\Service\OfficialReceiptGeneratorServiceInterface:
        alias: App\Service\OfficialReceiptGeneratorService
    
    App\Service\OfficialReceiptGeneratorService:
        public: true
        arguments:
            $projectDir: '%kernel.project_dir%'

    # Multi-Tenant Shipping Line Services
    App\Service\ShippingLineContextService:
