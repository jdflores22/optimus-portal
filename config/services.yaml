            $vapidPublicKey: '%env(VAPID_PUBLIC_KEY)%'
            $vapidPrivateKey: '%env(VAPID_PRIVATE_KEY)%'
            $vapidSubject: '%env(VAPID_SUBJECT)%'
        tags:
            - { name: 'console.command' }

    # Notification Delivery Rate Monitoring Command
    App\Command\MonitorNotificationDeliveryRateCommand:
        arguments:
            $metricsRepository: '@App\Repository\NotificationMetricsRepository'
            $mailer: '@mailer.mailer'
            $twig: '@twig'
            $logger: '@logger'
            $adminEmail: '%env(MAILER_FROM_EMAIL)%'
        tags:
            - { name: 'console.command' }

    # Push Subscription Cleanup Command
    # Schedule via cron: 0 3 * * * php bin/console app:cleanup-invalid-subscriptions
    # See docs/push-subscription-cleanup.md for detailed scheduling instructions
    App\Command\CleanupInvalidSubscriptionsCommand:
        tags:
            - { name: 'console.command' }

    App\Service\WorkflowOrchestrator:
